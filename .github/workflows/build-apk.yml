name: Build Bot Surat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NODE_MOBILE_VERSION: 24.21.0-0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Baileys and pack Node project
        run: |
          chmod +x scripts/prepare_node_assets.sh
          ./scripts/prepare_node_assets.sh

      - name: Download embedded Node.js for Android
        run: |
          chmod +x scripts/prepare_libnode.sh
          ./scripts/prepare_libnode.sh

      - name: Verify embedded Node
        run: |
          ls -lah app/libnode/bin/arm64-v8a/
          ls -lah app/libnode/include/
          test -f app/libnode/bin/arm64-v8a/libnode.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --stacktrace --info --no-daemon :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BotSuratWhatsApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14